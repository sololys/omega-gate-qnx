name: OmegaGate-QNX Zero-Float C11 & RTL Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GCC, Icarus Verilog, and Yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc iverilog yosys

      - name: Run full host C11 zero-float tests, demo, and RTL/Yosys synthesis gate
        run: make verify

      - name: Verify DCO 1.1 sign-off and zero-float diff gate across full commit span
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./scripts/check_dco_and_zero_float.sh "$PR_BASE" "$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            ./scripts/check_dco_and_zero_float.sh "$PUSH_BEFORE" "$PUSH_SHA"
          else
            ./scripts/check_dco_and_zero_float.sh HEAD~1 HEAD
          fi
